<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Product Manager OOP</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Add New Product</h1>

    <div class="add-product">

        <input
                type="text"
                id="productName"
                placeholder="New Product"
        >

        <button onclick="productManager.addProduct()">
            Add
        </button>

    </div>

    <h1>Display All Product</h1>

    <div class="header">

        <h3>Product Name</h3>

        <h3 id="count"></h3>

    </div>

    <table>

        <tbody id="productTable"></tbody>

    </table>

</div>

<script src="main.js"></script>

</body>
</html>
