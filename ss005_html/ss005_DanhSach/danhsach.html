<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách quốc gia và thành phố</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
        }
        ul {
            list-style-type: disc;
        }
        ol {
            margin-top: 10px;
        }
        li {
            margin: 5px 0;
        }
        .country {
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

<ul>
    <li>
        <span class="country">Việt Nam</span>
        <ol>
            <li>Hà Nội</li>
            <li>Sài Gòn</li>
            <li>Huế</li>
            <li>Đà Nẵng</li>
        </ol>
    </li>

    <li>
        <span class="country">Hoa Kỳ</span>
        <ol>
            <li>New York</li>
            <li>Los Angeles</li>
            <li>Chicago</li>
            <li>Houston</li>
        </ol>
    </li>

    <li>
        <span class="country">Trung Quốc</span>
        <ol>
            <li>Beijing</li>
            <li>Chongqing</li>
            <li>Shanghai</li>
            <li>Tianjin</li>
        </ol>
    </li>
</ul>

</body>
</html>
