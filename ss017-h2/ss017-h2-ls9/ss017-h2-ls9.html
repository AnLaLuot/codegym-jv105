<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra ký tự trong mảng</title>
</head>
<body>

<div>

    <h2>Kiểm tra ký tự trong mảng</h2>

    <div>
        <label>Nhập mảng ký tự:</label>

        <input type="text"
               id="array"
               placeholder="a,b,c,a,d">
    </div>

    <br>

    <div>
        <label>Nhập ký tự cần tìm:</label>

        <input type="text"
               id="character">
    </div>

    <br>

    <div>
        <button onclick="checkCharacter()">
            Kiểm tra
        </button>
    </div>

    <div>
        <p id="result"></p>
    </div>

</div>

<script src="main.js"></script>

</body>
</html>
