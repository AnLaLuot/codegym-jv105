<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tăng giá trị lên 1</title>
</head>
<body>

<h2>Kết quả</h2>

<p id="result"></p>

<script>

    function increaseNumber(number) {
        return number ++;
    }

    let result = increaseNumber(5);

    document.getElementById("result").innerText = result;

</script>

</body>
</html>
