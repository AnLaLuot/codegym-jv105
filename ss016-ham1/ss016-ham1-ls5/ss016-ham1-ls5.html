<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tìm chòm sao</title>
</head>
<body>

<h2 id="result"></h2>

<script>

    // mảng ngôi sao
    let stars = [
        "Polaris",
        "Aldebaran",
        "Deneb",
        "Vega",
        "Altair",
        "Dubhe",
        "Regulus"
    ];

    // mảng chòm sao tương ứng
    let constellations = [
        "Ursa Minor",
        "Taurus",
        "Cygnus",
        "Lyra",
        "Aquila",
        "Ursa Major",
        "Leo"
    ];

    // hàm tìm chòm sao
    function findConstellation(starName) {

        for (let i = 0; i < stars.length; i++) {

            if (starName === stars[i]) {
                return constellations[i];
            }
        }

        return "Không tìm thấy ngôi sao";
    }

    // nhập tên ngôi sao
    let input = prompt("Nhập tên ngôi sao:");

    // gọi hàm
    let result = findConstellation(input);

    // hiển thị kết quả
    document.getElementById("result").innerText =
        result;

</script>

</body>
</html>
