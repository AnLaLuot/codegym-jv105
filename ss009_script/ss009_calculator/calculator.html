<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>

    <style>

        .container {
            width: 300px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .button-group {
            margin-top: 10px;
        }

        button {
            display: block;
            margin-bottom: 8px;
            width: 200px;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>Calculator</h2>

    <div class="input-group">
        <input type="number"
               id="num1"
               placeholder="Số thứ nhất">
    </div>

    <div class="input-group">
        <input type="number"
               id="num2"
               placeholder="Số thứ hai">
    </div>

    <div class="button-group">

        <button type="button"
                onclick="calculate('+')">
            Addition (+)
        </button>

        <button type="button"
                onclick="calculate('-')">
            Subtraction (-)
        </button>

        <button type="button"
                onclick="calculate('*')">
            Multiplication (x)
        </button>

        <button type="button"
                onclick="calculate('/')">
            Division (/)
        </button>

    </div>

    <p id="result">
        Result:
    </p>

</div>

<script src="calculator.js"></script>

</body>
</html>
