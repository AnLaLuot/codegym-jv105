<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>

<h2>Calculator</h2>

<input type="number" id="num1" placeholder="Số thứ nhất">
<input type="number" id="num2" placeholder="Số thứ hai">

<br><br>

<button type="button" onclick="calculate('+')">Addition (+)</button>
<button type="button" onclick="calculate('-')">Subtraction (-)</button>
<button type="button" onclick="calculate('*')">Multiplication (x)</button>
<button type="button" onclick="calculate('/')">Division (/)</button>

<p id="result">Result: </p>

<script src="calculator.js"></script>
</body>
</html>
