<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sở thích của bạn</title>

    <style>
        body {
            background-color: #cfe8e8;
            font-family: Arial;
        }

        .container {
            width: 700px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border: 10px solid #cfe8e8;
        }

        .header {
            background: orange;
            color: white;
            text-align: center;
            font-size: 24px;
            padding: 10px;
            font-weight: bold;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: inline-block;
            width: 120px;
            color: blue;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 300px;
            padding: 5px;
        }

        .hobby {
            margin-left: 120px;
            color: orange;
        }

        .hobby label {
            width: auto;
            margin-right: 20px;
            color: orange;
        }

        .buttons {
            margin-left: 120px;
            margin-top: 20px;
        }

        button {
            padding: 8px 15px;
            margin-right: 10px;
            border: 2px solid gray;
            background: #eee;
            cursor: pointer;
        }
    </style>

</head>
<body>

<div class="container">
    <div class="header">SỞ THÍCH CỦA BẠN</div>

    <form>
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" name="yourname">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
        </div>

        <div class="form-group">
            <label>Sở thích</label>
            <div class="hobby">
                <label><input type="checkbox" name="hobby" value="thethao"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="amnhac"> Âm nhạc</label>
                <label><input type="checkbox" name="hobby" value="docsach"> Đọc sách</label><br>

                <label><input type="checkbox" name="hobby" value="luotweb"> Lướt web</label>
                <label><input type="checkbox" name="hobby" value="choigame"> Chơi game</label>
                <label><input type="checkbox" name="hobby" value="dienanh"> Điện ảnh</label><br>

                <label><input type="checkbox" name="hobby" value="dulich"> Du lịch</label>
            </div>
        </div>

        <div class="buttons">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>
</div>

</body>
</html>
