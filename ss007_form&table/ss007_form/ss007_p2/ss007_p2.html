<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký học viên</title>

    <style>
        body {
            font-family: Arial;
            background: #fff;
        }

        .container {
            width: 600px;
            margin: 30px auto;
            background: #f3f3a1;
            padding: 20px;
            border: 5px solid #e5e58c;
        }

        .header {
            background: #bfe3bf;
            color: blue;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
        }

        .form-group {
            margin: 12px 0;
        }

        label {
            display: inline-block;
            width: 120px;
            color: blue;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 250px;
            padding: 5px;
        }

        textarea {
            width: 250px;
            height: 80px;
        }

        .gender {
            display: inline-block;
        }

        .buttons {
            margin-left: 120px;
            margin-top: 15px;
        }

        button {
            padding: 6px 15px;
            margin-right: 10px;
        }
    </style>

</head>
<body>

<div class="container">
    <div class="header">ĐĂNG KÝ HỌC VIÊN</div>

    <form>
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" name="hoten">
        </div>

        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="text" name="ngaysinh">
        </div>

        <div class="form-group">
            <label>Giới tính</label>
            <div class="gender">
                <input type="radio" name="gioitinh" value="nam"> Nam
                <input type="radio" name="gioitinh" value="nu"> Nữ
            </div>
        </div>

        <div class="form-group">
            <label>Địa chỉ</label>
            <textarea name="diachi"></textarea>
        </div>

        <div class="form-group">
            <label>Lớp</label>
            <select name="lop">
                <option>-- Chọn lớp --</option>
                <option>Java</option>
                <option>Python</option>
                <option>JavaScript</option>
            </select>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
        </div>

        <div class="form-group">
            <label>Điện thoại</label>
            <input type="text" name="dienthoai">
        </div>

        <div class="buttons">
            <button type="submit">Đăng ký</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>
</div>

</body>
</html>
