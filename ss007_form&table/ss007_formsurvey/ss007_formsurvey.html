<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Market Research Survey</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 700px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            margin-bottom: 5px;
        }

        p {
            font-size: 14px;
            color: gray;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select, input[type="text"] {
            width: 300px;
            padding: 5px;
        }

        .inline {
            margin-right: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #ccc;
            text-align: center;
            padding: 5px;
        }

        th {
            background: #eee;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 7px 15px;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Market Research Survey</h2>
    <p>Please take a few moments to complete this satisfaction survey.</p>

    <form>

        <div class="form-group">
            <label>What is your age range?</label>
            <select name="age">
                <option>18-24</option>
                <option>25-34</option>
                <option>35-50</option>
            </select>
        </div>

        <div class="form-group">
            <label>What is your yearly income range?</label>
            <select name="income">
                <option>$0 - $25,000</option>
                <option>$25,000 - $50,000</option>
                <option>$50,000+</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </div>

        <div class="form-group">
            <label>Which products have you purchased in the last 2 months?</label>
            <input type="checkbox" name="product" value="p1"> Product 1<br>
            <input type="checkbox" name="product" value="p2"> Product 2<br>
            <input type="checkbox" name="product" value="p3"> Product 3
        </div>

        <div class="form-group">
            <label>How often would you use our new product?</label>
            <input type="radio" name="use"> Daily<br>
            <input type="radio" name="use"> Weekly<br>
            <input type="radio" name="use"> Monthly
        </div>

        <div class="form-group">
            <label>What would you pay for the new product?</label>
            $ <input type="text" name="dollars" style="width:80px;"> .
            <input type="text" name="cents" style="width:50px;">
        </div>

        <div class="form-group">
            <label>What features would you like to see in the new product?</label>
            <textarea name="features"></textarea>
        </div>

        <div class="form-group">
            <label>Please rate your level of agreement:</label>

            <table>
                <tr>
                    <th></th>
                    <th>Strongly Disagree</th>
                    <th>Disagree</th>
                    <th>Agree</th>
                    <th>Strongly Agree</th>
                </tr>

                <tr>
                    <td>Our products are priced fairly.</td>
                    <td><input type="radio" name="q1" value="1"></td>
                    <td><input type="radio" name="q1" value="2"></td>
                    <td><input type="radio" name="q1" value="3"></td>
                    <td><input type="radio" name="q1" value="4"></td>
                </tr>

                <tr>
                    <td>Our products are high quality.</td>
                    <td><input type="radio" name="q2" value="1"></td>
                    <td><input type="radio" name="q2" value="2"></td>
                    <td><input type="radio" name="q2" value="3"></td>
                    <td><input type="radio" name="q2" value="4"></td>
                </tr>

                <tr>
                    <td>You would recommend our product.</td>
                    <td><input type="radio" name="q3" value="1"></td>
                    <td><input type="radio" name="q3" value="2"></td>
                    <td><input type="radio" name="q3" value="3"></td>
                    <td><input type="radio" name="q3" value="4"></td>
                </tr>
            </table>
        </div>

        <button class="submit-btn" type="submit">Submit</button>

    </form>
</div>

</body>
</html>
