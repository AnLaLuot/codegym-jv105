<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng ký</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }
        .container {
            width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }
        h2 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
        }
        .gender {
            margin-top: 10px;
        }
        button {
            margin-top: 15px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">

        <label>Họ và tên:</label>
        <input type="text" name="fullname">

        <label>Email:</label>
        <input type="email" name="email">

        <label>Số điện thoại:</label>
        <input type="text" name="phone">

        <label>Giới tính:</label>
        <div class="gender">
            <input type="radio" name="gender" value="nam" checked> Nam
            <input type="radio" name="gender" value="nu"> Nữ
        </div>

        <button type="submit">Đăng ký</button>
    </form>
</div>

</body>
</html>
