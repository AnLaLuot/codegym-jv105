<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bàn cờ vua</title>
    <style>
        body {
            background-color: orange;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 60px;
            height: 60px;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
        }

        .white {
            background-color: #fff;
        }

        .black {
            background-color: #000;
        }

        .label {
            background-color: orange;
        }
    </style>
</head>
<body>

<table>
    <!-- Hàng số -->
    <tr>
        <td class="label"></td>
        <td class="label">1</td>
        <td class="label">2</td>
        <td class="label">3</td>
        <td class="label">4</td>
        <td class="label">5</td>
        <td class="label">6</td>
        <td class="label">7</td>
        <td class="label">8</td>
    </tr>

    <!-- Row A -->
    <tr>
        <td class="label">A</td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
    </tr>

    <!-- Row B -->
    <tr>
        <td class="label">B</td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
    </tr>

    <!-- Row C -->
    <tr>
        <td class="label">C</td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
    </tr>

    <!-- Row D -->
    <tr>
        <td class="label">D</td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
    </tr>

    <!-- Row E -->
    <tr>
        <td class="label">E</td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
    </tr>

    <!-- Row F -->
    <tr>
        <td class="label">F</td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
    </tr>

    <!-- Row G -->
    <tr>
        <td class="label">G</td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
    </tr>

    <!-- Row H -->
    <tr>
        <td class="label">H</td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
    </tr>

</table>

</body>
</html>
