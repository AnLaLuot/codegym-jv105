<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch tháng 10/2009</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            width: 80px;
            height: 60px;
            border: 1px solid #999;
            vertical-align: top;
            padding: 5px;
        }

        /* Header */
        .sun { background: red; color: white; }
        .sat { background: blue; color: white; }
        .weekday { background: orange; color: white; }

        /* Text màu */
        .text-sun { color: red; }
        .text-sat { color: blue; }

        .small {
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

<h2>Tháng 10 - October</h2>

<table>
    <!-- Header tiếng Việt -->
    <tr>
        <th class="sun">C.Nhật</th>
        <th class="weekday">T.Hai</th>

        <th class="weekday">T.Tư</th>
        <th class="weekday">T.Năm</th>
        <th class="weekday">T.Sáu</th>
        <th class="sat">T.Bảy</th>
    </tr>

    <!-- Header tiếng Anh -->
    <tr>
        <td class="text-sun">Sun</td>
        <td>Mon</td>
        <td>Tue</td>
        <td>Wed</td>
        <td>Thu</td>
        <td>Fri</td>

</body>
</html>
