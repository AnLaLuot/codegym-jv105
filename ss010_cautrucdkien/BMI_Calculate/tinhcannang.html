<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
</head>
<body>

<div>

    <h2>Tính BMI</h2>

    <div>
        <label>Cân nặng (kg):</label>

        <input type="number" id="weight">
    </div>

    <br>

    <div>
        <label>Chiều cao (m):</label>

        <input type="number" id="height">
    </div>

    <br>

    <div>
        <button onclick="tinhBMI()">
            Tính
        </button>
    </div>

    <div>
        <p id="result"></p>
    </div>

</div>

<script src="BMI_Calculate.js"></script>

</body>
</html>
